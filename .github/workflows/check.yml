name: Site checks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"   # every day at 09:00 Japan time
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Blog output is up to date
        run: |
          python3 tools/build_blog.py
          python3 tools/make_article_tests.py tests/article-examples.cjs
          git diff --exit-code -- blog sitemap.xml tests/article-examples.cjs
      - name: Test the page, the demo and the blog
        run: node tests/smoke.cjs
      - name: Run every code example from the articles (SheetJS 0.20.3)
        run: |
          npm install --no-save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          node tests/article-examples.cjs

  live:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public page is up
        run: curl -fsS https://shoheitaro003.github.io/sheetsift/ | grep -q "SheetSift"
      - name: Form service is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.web3forms.com/submit)
          echo "Web3Forms answered $code"
          test "$code" -lt 500
